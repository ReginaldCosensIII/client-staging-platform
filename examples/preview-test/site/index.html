<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Client Staging Platform — Infrastructure Test</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-subtle: #9ca3af;
      --accent: #38bdf8;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 28rem;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--text-subtle);
      margin-bottom: 1.75rem;
    }

    .info-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .info-label {
      color: var(--text-subtle);
    }

    .info-value {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success-glow);
    }

    .status-text {
      color: var(--success);
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-subtle);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">CP-001 Foundation</div>
    <h1>Client Staging Platform</h1>
    <div class="subtitle">Infrastructure Test</div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">Status:</span>
        <span class="info-value status-text">
          <span class="status-dot"></span>
          Running
        </span>
      </div>
      <div class="info-row">
        <span class="info-label">Environment:</span>
        <span class="info-value">Local</span>
      </div>
    </div>

    <div class="footer">
      Verification Workload &bull; Framework-Neutral Container Proof
    </div>
  </div>
</body>
</html>
